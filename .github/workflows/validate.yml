name: Validate theme
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ports/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:showcase
      - run: npm run package
      - name: Verify generated files and packaged changelog
        run: |
          git diff --exit-code
          unzip -p carmilla-*.vsix extension/changelog.md | cmp - CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: carmilla-vsix
          path: ports/vscode/*.vsix
