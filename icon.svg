<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#3A2438"/>
      <stop offset="60%" stop-color="#2E1B2D"/>
      <stop offset="100%" stop-color="#16101A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5FA2" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <!-- gradiente do anel: corre ao longo do arco, carmim no alto -> wisteria embaixo -->
    <linearGradient id="cgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5FA2"/>
      <stop offset="55%" stop-color="#FF8BB0"/>
      <stop offset="100%" stop-color="#D5A6FF"/>
    </linearGradient>
    <!-- uma pétala apontando para cima a partir do centro (64,64) -->
    <path id="petal" d="M64,64 C53,55 51,37 64,25 C77,37 75,55 64,64 Z"/>
    <path id="petalInner" d="M64,64 C57,58 56,45 64,39 C72,45 71,58 64,64 Z"/>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="62" r="44" fill="url(#glow)"/>

  <!-- o "C": arco com abertura de ±50° à direita -->
  <path d="M89.71,33.36 A40,40 0 1 0 89.71,94.64" fill="none" stroke="url(#cgrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- a flor: 66%, deslocada 1.5px para a abertura (centragem óptica) -->
  <g transform="translate(65.5,64) scale(0.66) translate(-64,-64)">
    <g fill="#FF5FA2">
      <use href="#petal" transform="rotate(0 64 64)"/>
      <use href="#petal" transform="rotate(60 64 64)"/>
      <use href="#petal" transform="rotate(120 64 64)"/>
      <use href="#petal" transform="rotate(180 64 64)"/>
      <use href="#petal" transform="rotate(240 64 64)"/>
      <use href="#petal" transform="rotate(300 64 64)"/>
    </g>
    <g fill="#FF9EC6">
      <use href="#petalInner" transform="rotate(30 64 64)"/>
      <use href="#petalInner" transform="rotate(90 64 64)"/>
      <use href="#petalInner" transform="rotate(150 64 64)"/>
      <use href="#petalInner" transform="rotate(210 64 64)"/>
      <use href="#petalInner" transform="rotate(270 64 64)"/>
      <use href="#petalInner" transform="rotate(330 64 64)"/>
    </g>
    <circle cx="64" cy="64" r="7.5" fill="#EDD795"/>
  </g>
</svg>
